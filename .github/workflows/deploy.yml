name: Build and deploy wiki

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install docfx
        run: dotnet tool install -g docfx --version 2.78.5

      - name: Build
        run: docfx build wwwroot/docfx.json

      # 404.html lives at the repo root, outside the docfx content root,
      # so the build never emits it. Apache's ErrorDocument needs it.
      - name: Stage 404 page
        run: cp 404.html wwwroot/_site/404.html

      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ secrets.DEPLOY_TARGET }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -az --delete \
            --exclude '.well-known' \
            -e "ssh -i ~/.ssh/id_ed25519 -p $PORT" \
            wwwroot/_site/ "$TARGET"
